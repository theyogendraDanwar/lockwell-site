<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lockwell — Choose Drive vault</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1419;
      color: #e8eef4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
    p { color: #9aa7b5; margin: 0 0 20px; text-align: center; max-width: 28rem; line-height: 1.45; }
    #status { color: #9aa7b5; margin-top: 12px; text-align: center; max-width: 28rem; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      background: #1a9b8e;
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #24303a; margin-top: 10px; }
    .err { color: #ff8a80; }
  </style>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <h1>Choose a KeePass vault</h1>
  <p>Pick a <strong>.kdbx</strong> from Google Drive. Lockwell keeps saves synced with that file.</p>
  <button type="button" id="pick">Open Google Drive picker</button>
  <button type="button" id="cancel" class="secondary">Cancel</button>
  <p id="status">Loading…</p>
  <script>
(function () {
  var RETURN = 'com.lockwell.app://drive-picker';
  var hashParams = new URLSearchParams(location.hash ? location.hash.slice(1) : '');
  var queryParams = new URLSearchParams(location.search || '');
  function param(name) {
    return hashParams.get(name) || queryParams.get(name) || '';
  }
  var token = param('access_token');
  var apiKey = param('api_key');
  var appId = param('app_id') || '375269897047';
  // Strip secrets from the address bar after reading.
  if (history.replaceState) {
    history.replaceState(null, '', location.pathname);
  }

  var statusEl = document.getElementById('status');
  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = isErr ? 'err' : '';
  }
  function postNative(msg) {
    try {
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      }
    } catch (e) {}
  }
  function goBack(qs) {
    var url = RETURN + (qs ? ('?' + qs) : '');
    postNative({ type: 'redirect', url: url });
    window.location.href = url;
  }

  document.getElementById('cancel').onclick = function () {
    goBack('cancel=1');
  };

  if (!token || !apiKey) {
    setStatus('Missing Google session. Close and open again from Lockwell.', true);
    postNative({ type: 'error', message: 'missing_token' });
    document.getElementById('pick').disabled = true;
    return;
  }

  function onPicked(data) {
    if (data.action === google.picker.Action.PICKED && data.docs && data.docs[0]) {
      var d = data.docs[0];
      var name = d.name || 'vault.kdbx';
      goBack('id=' + encodeURIComponent(d.id) + '&name=' + encodeURIComponent(name));
    } else if (data.action === google.picker.Action.CANCEL) {
      goBack('cancel=1');
    }
  }

  function createPicker() {
    try {
      // OAuth token only — do not trigger Google account cookie UI.
      var view = new google.picker.DocsView(google.picker.ViewId.DOCS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(false)
        .setMode(google.picker.DocsViewMode.LIST);
      var picker = new google.picker.PickerBuilder()
        .addView(view)
        .enableFeature(google.picker.Feature.NAV_HIDDEN)
        .setOAuthToken(token)
        .setDeveloperKey(apiKey)
        .setAppId(appId)
        .setOrigin(window.location.origin)
        .setCallback(onPicked)
        .setTitle('Choose a KeePass .kdbx')
        .setSize(Math.min(window.innerWidth, 1051), Math.min(window.innerHeight - 40, 650))
        .build();
      picker.setVisible(true);
      setStatus('Pick your .kdbx vault…');
      postNative({ type: 'ready' });
    } catch (e) {
      var msg = (e && e.message) || 'Could not open Google Drive picker.';
      setStatus(msg, true);
      postNative({ type: 'error', message: msg });
    }
  }

  document.getElementById('pick').onclick = function () {
    setStatus('Opening Google Drive…');
    gapi.load('picker', { callback: createPicker });
  };

  gapi.load('picker', {
    callback: function () {
      setStatus('Opening Google Drive…');
      createPicker();
    },
  });
})();
  </script>
</body>
</html>
